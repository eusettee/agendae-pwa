<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b5c4a">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<title>Agendaê · WhatsApp</title>
<style>
:root{--g:#0b5c4a;--g2:#128c6e;--bg:#efe7dd;--me:#d9fdd3;--ink:#111b21;--mut:#667781}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#d1d7db;display:flex;justify-content:center}
.app{width:100%;max-width:520px;height:100dvh;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 30px #0002}
header{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--g);color:#fff}
.av{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--g);display:grid;place-items:center;font-weight:800;font-size:24px}
header b{display:block;font-size:17px}header small{opacity:.85;font-size:13px}
.reset{margin-left:auto;background:#ffffff22;border:0;color:#fff;border-radius:18px;padding:8px 12px;font-size:13px}
#log{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:6px;background-image:radial-gradient(#0000000a 1px,transparent 1px);background-size:18px 18px}
.day{align-self:center;background:#fff;color:var(--mut);font-size:12px;padding:4px 10px;border-radius:8px;margin-bottom:6px;box-shadow:0 1px 1px #0001}
.b{max-width:86%;padding:8px 10px 6px;border-radius:10px;background:#fff;font-size:15.5px;line-height:1.4;box-shadow:0 1px 1px #0002;overflow-wrap:anywhere;animation:in .18s ease-out}
.b.me{align-self:flex-end;background:var(--me)}.b small{display:block;text-align:right;color:var(--mut);font-size:11px;margin-top:2px}
.typing{color:var(--mut);font-style:italic}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
#opts{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px;background:var(--bg)}#opts:empty{display:none}
#opts button{flex:1 1 calc(50% - 8px);min-height:46px;border:1.5px solid var(--g2);background:#fff;color:var(--g);border-radius:24px;font-size:15px;font-weight:600;padding:8px 12px}
#opts button:active{background:var(--me)}
form{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#f0f2f5}
input{flex:1;border:0;border-radius:22px;padding:12px 16px;font-size:16px;background:#fff;outline:none}
.send{width:48px;height:48px;border:0;border-radius:50%;background:var(--g2);color:#fff;font-size:20px}
.tip{font-size:12px;color:var(--mut);text-align:center;padding:0 12px 6px;background:#f0f2f5}
</style>
</head>
<body>
<div class="app">
  <header><div class="av" aria-hidden="true">+</div><div><b>Agendaê</b><small id="st">online</small></div><button class="reset" id="reset" type="button">Recomeçar</button></header>
  <main id="log" aria-live="polite"><span class="day">Hoje · teste com dados fictícios</span></main>
  <div id="opts" aria-label="Respostas rápidas"></div>
  <form id="f"><input id="in" maxlength="1000" autocomplete="off" placeholder="Digite ou toque numa opção" aria-label="Mensagem"><button class="send" aria-label="Enviar">➤</button></form>
  <div class="tip">Em emergência, ligue <a href="tel:192">192</a>. Não use dados reais.</div>
</div>
<script>
const $ = s => document.querySelector(s), log = $('#log'), opts = $('#opts');
const KEY = 'agendae.zap.session';
let sid, busy = false;
function session(reset) { try { sid = reset ? null : localStorage.getItem(KEY); if (!sid) { sid = crypto.randomUUID(); localStorage.setItem(KEY, sid); } } catch { sid = sid || crypto.randomUUID(); } }
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = t => esc(t).replace(/\*([^*\n]+)\*/g, '<b>$1</b>').replace(/(^|\s)_([^_\n]+)_/g, '$1<i>$2</i>').replace(/\n/g, '<br>');
const now = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
function bubble(text, me, cls = '') { const d = document.createElement('div'); d.className = `b ${me ? 'me' : ''} ${cls}`; d.innerHTML = fmt(text) + `<small>${now()}${me ? ' ✓✓' : ''}</small>`; log.append(d); log.scrollTop = log.scrollHeight; return d; }
function buttons(list = []) { opts.replaceChildren(...list.map(o => { const b = document.createElement('button'); b.type = 'button'; b.textContent = o.title; b.onclick = () => send(o.value, o.title); return b; })); log.scrollTop = log.scrollHeight; }
async function send(text, label, silent) {
  text = String(text).trim(); if (!text || busy) return; busy = true; buttons();
  if (!silent) bubble(label || text, true); $('#in').value = '';
  $('#st').textContent = 'digitando…'; const t = bubble('digitando…', false, 'typing');
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, sessionId: sid }), signal: AbortSignal.timeout(30000) });
    const j = await r.json(); t.remove(); bubble(r.ok ? j.reply : (j.error || 'Atendimento indisponível.')); if (r.ok) buttons(j.buttons);
  } catch { t.remove(); bubble('Sem conexão com o atendimento. Toque em *Recomeçar* ou tente de novo.'); buttons([{ value: 'oi', title: 'Tentar de novo' }]); }
  finally { busy = false; $('#st').textContent = 'online'; }
}
$('#f').onsubmit = e => { e.preventDefault(); send($('#in').value); };
$('#reset').onclick = () => { session(true); log.querySelectorAll('.b').forEach(b => b.remove()); send('0', null, true); };
session(); send('oi', null, true);
</script>
</body>
</html>
